<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Медиатека — загрузка и выгрузка фото и видео</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--text:#15171c;--muted:#6b7280;--line:#e2e5ea;--accent:#4f46e5;--on-accent:#fff;--danger:#dc2626;--soft:#eef0ff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--surface:#181b22;--text:#eceef2;--muted:#9aa1ad;--line:#2a2f39;--accent:#818cf8;--on-accent:#0f1115;--danger:#f87171;--soft:#232748;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--surface:#181b22;--text:#eceef2;--muted:#9aa1ad;--line:#2a2f39;--accent:#818cf8;--on-accent:#0f1115;--danger:#f87171;--soft:#232748;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
header h1{margin:0;font-size:28px;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--muted)}
#drop{margin-top:20px;border:2px dashed var(--line);border-radius:16px;background:var(--surface);padding:36px 16px;text-align:center;cursor:pointer;transition:.15s}
#drop:hover,#drop:focus-visible,#drop.drag{border-color:var(--accent);background:var(--soft);outline:none}
#drop svg{width:44px;height:44px;color:var(--accent)}
#drop strong{display:block;font-size:18px;margin-top:8px}
#drop span{color:var(--muted);font-size:14px}
#prog{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#prog progress{width:100%;height:8px;accent-color:var(--accent)}
#prog div{font-size:13px;color:var(--muted);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 14px}
.bar input[type=search],.bar select{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:0 12px;font:inherit}
.bar input[type=search]{flex:1 1 180px;min-width:0}
.chips{display:flex;gap:6px}
.chip,.btn{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:0 14px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:hover:not(:disabled),.chip:hover{filter:brightness(.96)}
#stats{color:var(--muted);font-size:14px;margin-bottom:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:4/3;border:0;padding:0;background:#0003;cursor:pointer;display:block;width:100%;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px}
.badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;padding:2px 8px;border-radius:99px}
.play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;pointer-events:none}
.play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.info{padding:10px 12px 6px;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:6px;padding:6px 12px 12px;margin-top:auto}
.acts .btn{height:32px;padding:0 10px;font-size:13px;flex:1}
#empty{text-align:center;color:var(--muted);padding:48px 12px}
.note{margin-top:32px;font-size:13px;color:var(--muted);text-align:center}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50;width:min(92vw,420px)}
.toast{background:#1f2937;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.err{background:#b91c1c}
#lb{position:fixed;inset:0;z-index:40;background:rgba(5,6,8,.94);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color:#fff}
#lb .head{display:flex;gap:10px;align-items:center;padding:10px 14px}
#lb .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb .t small{display:block;color:#aab;font-size:12px}
#lb .btn{background:#ffffff1a;border-color:#ffffff33;color:#fff}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 56px}
#stage img,#stage video{max-width:100%;max-height:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:#ffffff1a;color:#fff;font-size:26px;cursor:pointer}
#prev{left:6px}#next{right:6px}
@media (max-width:560px){#stage{padding:0 4px}.nav{opacity:.8;width:36px}.wrap{padding-top:16px}header h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Медиатека</h1>
    <p>Загружайте фото и видео, просматривайте их и скачивайте обратно — по одному или архивом.</p>
  </header>

  <div id="drop" role="button" tabindex="0" aria-label="Выбрать файлы для загрузки">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
    <strong>Перетащите фото и видео сюда</strong>
    <span>или нажмите, чтобы выбрать · также работает Ctrl+V · до 1 ГБ на файл</span>
    <input id="file" type="file" multiple accept="image/*,video/*,.heic,.heif,.mkv" hidden>
  </div>
  <div id="prog" hidden><div id="progText"></div><progress id="progBar" value="0" max="1"></progress></div>

  <div class="bar">
    <input id="q" type="search" placeholder="Поиск по названию…" aria-label="Поиск">
    <div class="chips" role="group" aria-label="Фильтр">
      <button class="chip" data-f="all" aria-pressed="true">Все</button>
      <button class="chip" data-f="image" aria-pressed="false">Фото</button>
      <button class="chip" data-f="video" aria-pressed="false">Видео</button>
    </div>
    <select id="sort" aria-label="Сортировка">
      <option value="new">Сначала новые</option>
      <option value="old">Сначала старые</option>
      <option value="name">По названию</option>
      <option value="size">По размеру</option>
    </select>
    <button id="zip" class="btn primary">Скачать ZIP</button>
    <button id="clear" class="btn danger">Очистить всё</button>
  </div>
  <div id="stats"></div>
  <div id="grid"></div>
  <div id="empty" hidden></div>
  <p class="note" id="note"></p>
</div>

<div id="lb" hidden role="dialog" aria-modal="true" aria-label="Просмотр">
  <div class="head">
    <div class="t"><span id="lbTitle"></span><small id="lbCount"></small></div>
    <button id="lbDl" class="btn">Скачать</button>
    <button id="lbClose" class="btn" aria-label="Закрыть">✕</button>
  </div>
  <div id="stage"></div>
  <button id="prev" class="nav" aria-label="Назад">‹</button>
  <button id="next" class="nav" aria-label="Вперёд">›</button>
</div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var IMG=/\.(jpe?g|png|gif|webp|avif|bmp|svg|heic|heif|tiff?)$/i, VID=/\.(mp4|webm|mov|m4v|mkv|ogv|avi|3gp)$/i;
var MAX=1024*1024*1024, SAFE=/\.(gif|png|jpe?g|webp|mp4|webm|mov|svg|zip)$/i;
var items=[], filter='all', query='', sortBy='new', view=[], idx=-1, db=null, busy=false;

function kindOf(f){
  var t=f.type||'';
  if(t.indexOf('image/')===0)return 'image';
  if(t.indexOf('video/')===0)return 'video';
  if(IMG.test(f.name))return 'image';
  if(VID.test(f.name))return 'video';
  return null;
}
function fmt(b){
  if(b<1024)return b+' Б';
  var u=['КБ','МБ','ГБ'],i=-1;
  do{b/=1024;i++}while(b>=1024&&i<2);
  return b.toFixed(b<10?1:0)+' '+u[i];
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function toast(msg,err){
  var t=el('div','toast'+(err?' err':''),msg);
  $('#toasts').appendChild(t);
  setTimeout(function(){t.remove()},err?5000:3000);
}
function tick(){return new Promise(function(r){setTimeout(r,0)})}

/* ---------- IndexedDB (с безопасным отказом в память) ---------- */
function openDB(){
  return new Promise(function(res){
    try{
      if(!window.indexedDB)return res(null);
      var r=indexedDB.open('media-vault-v1',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('files',{keyPath:'id'})};
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){res(null)};
      r.onblocked=function(){res(null)};
    }catch(e){res(null)}
  });
}
function tx(mode,fn){
  return new Promise(function(res,rej){
    if(!db)return res(undefined);
    try{
      var t=db.transaction('files',mode),out=fn(t.objectStore('files'));
      t.oncomplete=function(){res(out&&out.result)};
      t.onerror=t.onabort=function(){rej(t.error||new Error('tx'))};
    }catch(e){rej(e)}
  });
}

/* ---------- Сохранение файлов пользователю ---------- */
var dlP=(window.claude&&typeof window.claude.use==='function')
  ? window.claude.use('downloads').catch(function(){return null})
  : Promise.resolve(null);

function anchor(name,url){
  var a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function zipSave(files,zipName){
  if(!window.JSZip){toast('Модуль архивации не загрузился. Проверьте интернет-соединение.',true);return Promise.resolve(false)}
  var z=new JSZip(),used={};
  files.forEach(function(f){
    var n=f.name,i=1;
    while(used[n.toLowerCase()]){var d=f.name.lastIndexOf('.');n=d>0?f.name.slice(0,d)+' ('+(++i)+')'+f.name.slice(d):f.name+' ('+(++i)+')'}
    used[n.toLowerCase()]=1;z.file(n,f.blob);
  });
  return z.generateAsync({type:'blob',compression:'STORE'}).then(function(b){return saveBlob(zipName,b)})
    .catch(function(){toast('Не удалось создать архив',true);return false});
}
function saveBlob(name,blob){
  return dlP.then(function(d){
    if(!d){
      var u=URL.createObjectURL(blob);anchor(name,u);setTimeout(function(){URL.revokeObjectURL(u)},4000);
      return true;
    }
    return d.save({filename:name,data:blob}).then(function(){toast('Файл сохранён');return true},function(e){
      var c=e&&e.code;
      if(c==='declined')return false;
      if((c==='rejected_extension'||c==='extension_not_enabled')&&!/\.zip$/i.test(name))
        return zipSave([{name:name,blob:blob}],name.replace(/\.[^.]*$/,'')+'.zip');
      toast(c==='too_large'?'Файл слишком большой для сохранения':'Не удалось сохранить файл',true);
      return false;
    });
  });
}
function downloadOne(it){return saveBlob(it.name,it.blob)}

/* ---------- Список, фильтры, отрисовка ---------- */
function list(){
  var q=query.trim().toLowerCase();
  var r=items.filter(function(i){return (filter==='all'||i.kind===filter)&&(!q||i.name.toLowerCase().indexOf(q)>-1)});
  r.sort(function(a,b){
    if(sortBy==='old')return a.added-b.added;
    if(sortBy==='name')return a.name.localeCompare(b.name,'ru',{numeric:true});
    if(sortBy==='size')return b.size-a.size;
    return b.added-a.added;
  });
  return r;
}
function arm(btn,label,fn){
  var orig=btn.textContent,t=null;
  btn.addEventListener('click',function(){
    if(btn.dataset.armed){clearTimeout(t);delete btn.dataset.armed;btn.textContent=orig;fn()}
    else{btn.dataset.armed='1';btn.textContent=label;t=setTimeout(function(){delete btn.dataset.armed;btn.textContent=orig},3000)}
  });
}
function card(it){
  var c=el('div','card'),th=el('button','thumb');
  th.type='button';th.setAttribute('aria-label','Открыть: '+it.name);
  th.addEventListener('click',function(){openLb(it.id)});
  if(it.kind==='image'){
    var im=document.createElement('img');im.loading='lazy';im.alt=it.name;im.src=it.url;
    im.onerror=function(){im.replaceWith(el('div','ph','Нет превью'))};
    th.appendChild(im);
  }else{
    var v=document.createElement('video');v.muted=true;v.preload='metadata';v.playsInline=true;v.src=it.url+'#t=0.1';
    v.onerror=function(){v.replaceWith(el('div','ph','Нет превью'))};
    th.appendChild(v);th.appendChild(el('span','play'));
  }
  th.appendChild(el('span','badge',it.kind==='image'?'Фото':'Видео'));
  var info=el('div','info');
  var n=el('div','name',it.name);n.title=it.name;
  info.appendChild(n);
  info.appendChild(el('div','meta',fmt(it.size)+' · '+new Date(it.added).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})));
  var acts=el('div','acts'),d=el('button','btn','Скачать'),x=el('button','btn danger','Удалить');
  d.type=x.type='button';
  d.addEventListener('click',function(){downloadOne(it)});
  arm(x,'Точно?',function(){removeItem(it.id)});
  acts.append(d,x);c.append(th,info,acts);
  return c;
}
function render(){
  var r=list(),g=$('#grid');
  g.replaceChildren.apply(g,r.map(card));
  var total=items.reduce(function(s,i){return s+i.size},0);
  var ph=items.filter(function(i){return i.kind==='image'}).length;
  $('#stats').textContent=items.length?('Всего: '+items.length+' · фото '+ph+' · видео '+(items.length-ph)+' · '+fmt(total)+(r.length!==items.length?' · показано '+r.length:'')):'';
  var e=$('#empty');
  e.hidden=r.length>0;
  e.textContent=items.length?'Ничего не найдено. Измените поиск или фильтр.':'Пока пусто. Добавьте первые фото или видео выше.';
  $('#zip').disabled=!r.length;
  $('#clear').disabled=!items.length;
}

/* ---------- Загрузка ---------- */
async function addFiles(fl){
  var files=Array.prototype.slice.call(fl||[]);
  if(!files.length)return;
  if(busy){toast('Подождите, предыдущая загрузка ещё идёт',true);return}
  var ok=[],bad=0,big=0;
  files.forEach(function(f){
    var k=kindOf(f);
    if(!k||f.size===0)bad++;else if(f.size>MAX)big++;else ok.push({f:f,k:k});
  });
  if(bad)toast('Пропущено файлов неподдерживаемого типа или пустых: '+bad,true);
  if(big)toast('Пропущено слишком больших файлов (более 1 ГБ): '+big,true);
  if(!ok.length)return;
  busy=true;$('#prog').hidden=false;
  var mem=0,bar=$('#progBar');bar.max=ok.length;
  for(var i=0;i<ok.length;i++){
    var f=ok[i].f;
    $('#progText').textContent='Загрузка '+(i+1)+' из '+ok.length+': '+f.name;
    bar.value=i;await tick();
    var it={id:uid(),name:f.name,type:f.type,size:f.size,added:Date.now()+i,kind:ok[i].k,blob:f,url:URL.createObjectURL(f)};
    try{
      if(db)await tx('readwrite',function(s){return s.put({id:it.id,name:it.name,type:it.type,size:it.size,added:it.added,kind:it.kind,blob:f})});
      else mem++;
    }catch(e){mem++}
    items.push(it);
  }
  bar.value=ok.length;
  busy=false;
  setTimeout(function(){$('#prog').hidden=true},600);
  toast('Добавлено файлов: '+ok.length);
  if(mem)toast('Не удалось сохранить в браузере ('+mem+'): файлы доступны до закрытия страницы.',true);
  render();
}
async function removeItem(id){
  var i=items.findIndex(function(x){return x.id===id});
  if(i<0)return;
  var it=items.splice(i,1)[0];
  URL.revokeObjectURL(it.url);
  try{await tx('readwrite',function(s){return s.delete(id)})}catch(e){}
  render();
}

/* ---------- Просмотр ---------- */
function showLb(){
  var it=view[idx],st=$('#stage');
  var old=st.querySelector('video');if(old)old.pause();
  st.replaceChildren();
  var m;
  if(it.kind==='video'){m=document.createElement('video');m.controls=true;m.playsInline=true;m.src=it.url;
    m.onerror=function(){st.replaceChildren(el('div','ph','Формат не поддерживается браузером — скачайте файл'))}}
  else{m=document.createElement('img');m.alt=it.name;m.src=it.url;
    m.onerror=function(){st.replaceChildren(el('div','ph','Предпросмотр недоступен — скачайте файл'))}}
  st.appendChild(m);
  $('#lbTitle').textContent=it.name;
  $('#lbCount').textContent=(idx+1)+' / '+view.length+' · '+fmt(it.size);
  $('#prev').hidden=$('#next').hidden=view.length<2;
}
function openLb(id){
  view=list();idx=view.findIndex(function(x){return x.id===id});
  if(idx<0)return;
  $('#lb').hidden=false;document.body.style.overflow='hidden';showLb();$('#lbClose').focus();
}
function closeLb(){
  var v=$('#stage').querySelector('video');if(v)v.pause();
  $('#stage').replaceChildren();$('#lb').hidden=true;document.body.style.overflow='';
}
function step(d){if(view.length<2)return;idx=(idx+d+view.length)%view.length;showLb()}

/* ---------- События ---------- */
var drop=$('#drop'),input=$('#file');
drop.addEventListener('click',function(){input.click()});
drop.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}});
input.addEventListener('change',function(){addFiles(input.files);input.value=''});
function hasFiles(e){return e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>-1}
window.addEventListener('dragenter',function(e){if(hasFiles(e)){e.preventDefault();drop.classList.add('drag')}});
window.addEventListener('dragover',function(e){if(hasFiles(e)){e.preventDefault();drop.classList.add('drag')}});
window.addEventListener('dragleave',function(e){if(!e.relatedTarget)drop.classList.remove('drag')});
window.addEventListener('drop',function(e){
  if(!hasFiles(e))return;
  e.preventDefault();drop.classList.remove('drag');addFiles(e.dataTransfer.files);
});
document.addEventListener('paste',function(e){
  var f=e.clipboardData&&e.clipboardData.files;
  if(f&&f.length){e.preventDefault();addFiles(f)}
});
$('#q').addEventListener('input',function(e){query=e.target.value;render()});
$('#sort').addEventListener('change',function(e){sortBy=e.target.value;render()});
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click',function(){
    filter=c.dataset.f;
    document.querySelectorAll('.chip').forEach(function(o){o.setAttribute('aria-pressed',String(o===c))});
    render();
  });
});
$('#zip').addEventListener('click',async function(){
  var r=list();if(!r.length)return;
  var b=$('#zip');b.disabled=true;b.textContent='Готовлю архив…';
  try{await zipSave(r.map(function(i){return{name:i.name,blob:i.blob}}),'media-'+new Date().toISOString().slice(0,10)+'.zip')}
  finally{b.textContent='Скачать ZIP';render()}
});
arm($('#clear'),'Удалить всё? Нажмите ещё раз',async function(){
  items.forEach(function(i){URL.revokeObjectURL(i.url)});
  items=[];
  try{await tx('readwrite',function(s){return s.clear()})}catch(e){}
  render();toast('Медиатека очищена');
});
$('#lbClose').addEventListener('click',closeLb);
$('#lbDl').addEventListener('click',function(){if(view[idx])downloadOne(view[idx])});
$('#prev').addEventListener('click',function(){step(-1)});
$('#next').addEventListener('click',function(){step(1)});
$('#lb').addEventListener('click',function(e){if(e.target.id==='stage')closeLb()});
document.addEventListener('keydown',function(e){
  if($('#lb').hidden)return;
  if(e.key==='Escape')closeLb();
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='ArrowRight')step(1);
});

/* ---------- Старт ---------- */
(async function init(){
  db=await openDB();
  if(db){
    try{
      var rows=(await tx('readonly',function(s){return s.getAll()}))||[];
      items=rows.filter(function(r){return r&&r.blob}).map(function(r){
        r.kind=r.kind||kindOf({type:r.type,name:r.name})||'image';
        r.url=URL.createObjectURL(r.blob);
        return r;
      });
    }catch(e){items=[]}
  }
  $('#note').textContent=db
    ? 'Файлы хранятся только в вашем браузере и никуда не отправляются.'
    : 'Хранилище браузера недоступно — файлы сохранятся только до закрытия страницы.';
  render();
})();
})();
</script>
</body>
</html>
